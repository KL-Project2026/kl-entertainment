providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@10.33.2 --activate",
  "pnpm install --frozen-lockfile",
]

[phases.build]
cmds = ["pnpm --filter @workspace/api-server build"]

[start]
cmd = "node artifacts/api-server/dist/index.cjs"
